<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">get_next_line</title>
  <desc id="d">Read a file descriptor one line at a time. 24 tests, 0 leaks, 1 static stash, BUFFER_SIZE 42.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b6e"/>
      <stop offset="0.55" stop-color="#2230b8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle cx="1130" cy="40" r="210" fill="#ffffff" opacity="0.06"/>
    <circle cx="90" cy="440" r="170" fill="#000000" opacity="0.12"/>
  </g>

  <!-- Titre -->
  <text x="56" y="160" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="76" font-weight="800" fill="url(#title)">get_next_line</text>
  <text x="60" y="224" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="600" fill="#ffffff">One line at a time.</text>
  <text x="60" y="268" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#c7d2fe">Static variables, read() and zero leaks.</text>

  <!-- Tuiles -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
    <g transform="translate(60 312)">
      <rect width="158" height="84" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="18" y="46" font-size="40" font-weight="800" fill="#22d3ee">24</text>
      <text x="18" y="68" font-size="14" fill="#c7d2fe">test cases</text>
    </g>
    <g transform="translate(236 312)">
      <rect width="158" height="84" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="18" y="46" font-size="40" font-weight="800" fill="#a5b4fc">1</text>
      <text x="18" y="68" font-size="14" fill="#c7d2fe">static stash</text>
    </g>
    <g transform="translate(412 312)">
      <rect width="158" height="84" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="18" y="46" font-size="40" font-weight="800" fill="#34d399">0</text>
      <text x="18" y="68" font-size="14" fill="#c7d2fe">leaks</text>
    </g>
    <g transform="translate(588 312)">
      <rect width="158" height="84" rx="14" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="18" y="46" font-size="40" font-weight="800" fill="#facc15">42</text>
      <text x="18" y="68" font-size="14" fill="#c7d2fe">BUFFER_SIZE</text>
    </g>
  </g>

  <!-- Terminal -->
  <g transform="translate(790 70)" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="15">
    <rect width="350" height="280" rx="18" fill="#0d1030"/>
    <circle cx="28" cy="28" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="28" r="7" fill="#febc2e"/>
    <circle cx="76" cy="28" r="7" fill="#28c840"/>

    <text x="28" y="76" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> cc -D BUFFER_SIZE=42 *.c</text>
    <text x="28" y="116" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> ./gnl file.txt</text>
    <text x="28" y="142" fill="#94a3b8">first line</text>
    <text x="28" y="166" fill="#94a3b8">second line</text>
    <text x="28" y="190" fill="#94a3b8">last line</text>
    <text x="28" y="230" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> valgrind ./gnl file.txt</text>
    <text x="28" y="256" fill="#34d399">no leaks, no errors</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
