<text x="756" y="138"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> make</tspan></text>
<text x="756" y="166" fill="#94a3b8">cc -Wall -Wextra -Werror -c *.c</text>
<text x="756" y="194" fill="#94a3b8">ar rcs libft.a *.o</text>
