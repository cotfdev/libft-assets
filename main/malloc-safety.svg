<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="ft_split when malloc fails: free everything already allocated, return NULL" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1446"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect width="1200" height="400" rx="22" fill="url(#bg)"/>
<text x="50" y="48" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">When malloc fails halfway</text>
<text x="50" y="76" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#94a3b8">ft_split, step by step</text>
<text x="50" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="3" fill="#38bdf8">ALLOCATE</text>
<text x="50" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="3" fill="#fbbf24">CLEAN UP</text>
<rect x="50" y="130" width="240" height="84" rx="14" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-width="1.5"/>
<text x="170" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#34d399">malloc(array)</text>
<text x="170" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">ok</text>
<rect x="330" y="130" width="240" height="84" rx="14" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-width="1.5"/>
<text x="450" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#34d399">malloc(word 1)</text>
<text x="450" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">ok</text>
<rect x="610" y="130" width="240" height="84" rx="14" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-width="1.5"/>
<text x="730" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#34d399">malloc(word 2)</text>
<text x="730" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">ok</text>
<rect x="890" y="130" width="240" height="84" rx="14" fill="#f87171" fill-opacity=".15" stroke="#f87171" stroke-width="1.5"/>
<text x="1010" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#f87171">malloc(word 3)</text>
<text x="1010" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">returns NULL</text>
<rect x="890" y="270" width="240" height="84" rx="14" fill="#fbbf24" fill-opacity=".15" stroke="#fbbf24" stroke-width="1.5"/>
<text x="1010" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#fbbf24">free(word 2)</text>
<text x="1010" y="332" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">undo</text>
<rect x="610" y="270" width="240" height="84" rx="14" fill="#fbbf24" fill-opacity=".15" stroke="#fbbf24" stroke-width="1.5"/>
<text x="730" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#fbbf24">free(word 1)</text>
<text x="730" y="332" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">undo</text>
<rect x="330" y="270" width="240" height="84" rx="14" fill="#fbbf24" fill-opacity=".15" stroke="#fbbf24" stroke-width="1.5"/>
<text x="450" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#fbbf24">free(array)</text>
<text x="450" y="332" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">undo</text>
<rect x="50" y="270" width="240" height="84" rx="14" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-width="1.5"/>
<text x="170" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#34d399">return NULL</text>
<text x="170" y="332" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">no leak</text>
<g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)">
<line x1="294" y1="172" x2="326" y2="172"/><line x1="574" y1="172" x2="606" y2="172"/><line x1="854" y1="172" x2="886" y2="172"/>
<line x1="1010" y1="218" x2="1010" y2="266"/>
<line x1="886" y1="312" x2="854" y2="312"/><line x1="606" y1="312" x2="574" y2="312"/><line x1="326" y1="312" x2="294" y2="312"/>
</g>
<text x="600" y="388" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#94a3b8">Tested by failing the n-th malloc, for every n, on ft_split and ft_lstmap: zero leaks.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
